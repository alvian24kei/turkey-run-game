<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wattle's Corn-Decoy Run — a turkey escape game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a2e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Wattle's Corn-Decoy Run: a turkey flees Farmer Bram through the farmyard, barn, kitchen yard and woods. Move lanes with arrow keys, jump with Space, dash with Shift, hide in haystacks with Down, toss a corn decoy with C."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
